<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Blood Throne Launcher</title>

<!-- GOTHIC FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700;900&family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ======================================================
   RESET
====================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* ======================================================
   ROOT
====================================================== */

:root{
    --bg:#0b0b0f;
    --panel:#111116;
    --hover:#1a1a21;
    --blood:#3b0000;
    --accent:#7a0000;
    --text:#d1c2b0;
    --highlight:#ece0cf;
    --border:#2d2d35;
}

/* ======================================================
   BODY
====================================================== */

body{
    background:#000;
    font-family:'Cinzel', serif;
    color:var(--text);
    position:relative;
}

/* ======================================================
   BACKGROUND
====================================================== */

.bg{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            rgba(0,0,0,.45),
            rgba(0,0,0,.82)
        ),
        url("bg.png");
    background-size:cover;
    background-position:center;
    transform:scale(1.02);
    z-index:-20;
}

/* cinematic dark edges */

.vignette{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at center,
            transparent 15%,
            rgba(0,0,0,.75) 100%
        );
    z-index:-10;
}

/* ======================================================
   MOON GLOW
====================================================== */

.moon-glow{
    position:absolute;
    top:70px;
    right:27%;
    width:280px;
    height:280px;
    border-radius:50%;
    background:rgba(255,0,0,.15);
    filter:blur(70px);
    animation:moonPulse 6s ease-in-out infinite;
    pointer-events:none;
}

@keyframes moonPulse{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

/* ======================================================
   CLOUDS
====================================================== */

.clouds{
    position:absolute;
    inset:0;
    background:
        url("https://www.transparenttextures.com/patterns/foggy-birds.png");
    opacity:.08;
    animation:cloudMove 120s linear infinite;
}

@keyframes cloudMove{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-900px);
    }
}

/* ======================================================
   FOG
====================================================== */

.fog{
    position:absolute;
    width:140%;
    height:260px;
    left:-20%;
    background:rgba(255,255,255,.05);
    filter:blur(80px);
    pointer-events:none;
}

.fog1{
    bottom:-50px;
    animation:fogDrift 18s linear infinite;
}

.fog2{
    bottom:120px;
    opacity:.25;
    animation:fogDrift 28s linear infinite reverse;
}

@keyframes fogDrift{

    0%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(-120px);
    }

    100%{
        transform:translateX(0);
    }
}

/* ======================================================
   MAIN LAYOUT
====================================================== */

.container{
    width:100%;
    height:100vh;
    display:grid;
    grid-template-columns:18% 42% 40%;
    position:relative;
    z-index:5;
}

/* ======================================================
   SIDEBAR
====================================================== */

.sidebar{
    padding:40px 24px;
    background:linear-gradient(
        to right,
        rgba(0,0,0,.75),
        rgba(0,0,0,.25)
    );
    border-right:1px solid rgba(255,255,255,.05);

    backdrop-filter:blur(8px);

    display:flex;
    flex-direction:column;
    justify-content:center;
}

/* ======================================================
   LOGO
====================================================== */

.logo{
    margin-bottom:70px;
    position:relative;
}

.logo-main{

    font-family:'UnifrakturCook', cursive;

    font-size:68px;
    line-height:1;

    color:#d7c5b1;

    text-shadow:
        0 0 10px rgba(255,255,255,.08),
        0 0 20px rgba(255,0,0,.2),
        0 0 40px rgba(255,0,0,.12);

    letter-spacing:2px;
}

.logo-sub{

    margin-top:10px;

    font-size:11px;
    letter-spacing:6px;

    color:#a88b8b;
}

/* ======================================================
   MENU
====================================================== */

.menu{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.menu-item{

    position:relative;

    padding:18px 20px;

    background:
        linear-gradient(
            to right,
            rgba(17,17,22,.95),
            rgba(26,26,33,.65)
        );

    border:1px solid rgba(255,255,255,.05);

    cursor:pointer;

    overflow:hidden;

    transition:.35s;

    display:flex;
    align-items:center;
    gap:14px;

    letter-spacing:2px;

    font-size:13px;
}

.menu-item::before{

    content:"";

    position:absolute;
    left:0;
    top:0;

    width:0%;
    height:100%;

    background:
        linear-gradient(
            to right,
            rgba(122,0,0,.25),
            transparent
        );

    transition:.4s;
}

.menu-item:hover{

    transform:translateX(8px) scale(1.02);

    border-color:rgba(255,0,0,.2);

    box-shadow:
        0 0 18px rgba(255,0,0,.25);
}

.menu-item:hover::before{
    width:100%;
}

.menu-icon{
    color:#ff4444;
    font-size:15px;
}

/* ======================================================
   LOGIN PANEL
====================================================== */

.login-section{

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;
}

.login-panel{

    width:100%;
    max-width:540px;

    background:
        linear-gradient(
            to bottom,
            rgba(10,10,12,.82),
            rgba(0,0,0,.75)
        );

    border:1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(18px);

    padding:58px;

    position:relative;

    overflow:hidden;

    box-shadow:
        0 0 50px rgba(0,0,0,.9),
        0 0 50px rgba(255,0,0,.08);
}

.login-panel::before{

    content:"";

    position:absolute;
    inset:10px;

    border:1px solid rgba(255,0,0,.08);

    pointer-events:none;
}

.panel-top{

    color:#b69d9d;

    font-size:11px;

    letter-spacing:6px;

    margin-bottom:16px;
}

.panel-title{

    font-size:62px;

    line-height:.95;

    margin-bottom:18px;

    color:#f0e0d0;

    text-shadow:
        0 0 15px rgba(255,255,255,.05);
}

.panel-desc{

    font-family:'Cormorant Garamond', serif;

    font-size:23px;

    line-height:1.4;

    color:#c4b5a6;

    margin-bottom:42px;
}

/* ======================================================
   INPUTS
====================================================== */

.input-group{
    margin-bottom:24px;
}

.input-group label{

    display:block;

    margin-bottom:10px;

    font-size:11px;

    letter-spacing:4px;

    color:#8d7a6d;
}

.input-group input{

    width:100%;

    padding:18px;

    background:rgba(0,0,0,.7);

    border:1px solid rgba(255,0,0,.14);

    color:#fff;

    font-size:15px;

    outline:none;

    transition:.3s;
}

.input-group input:focus{

    border-color:#ff3b3b;

    box-shadow:
        0 0 15px rgba(255,0,0,.25);
}

/* ======================================================
   OPTIONS
====================================================== */

.options{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:10px;
    margin-bottom:35px;

    font-size:13px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
}

.options a{

    text-decoration:none;

    color:#ff5959;
}

/* ======================================================
   BUTTON
====================================================== */

.login-btn{

    width:100%;

    padding:20px;

    border:none;

    cursor:pointer;

    font-family:'Cinzel', serif;

    font-size:15px;

    letter-spacing:4px;

    color:white;

    background:
        linear-gradient(
            to bottom,
            #920000,
            #350000
        );

    border:1px solid rgba(255,255,255,.08);

    transition:.3s;

    box-shadow:
        0 0 25px rgba(255,0,0,.15);
}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 30px rgba(255,0,0,.35);
}

.login-btn:active{
    transform:scale(.98);
}

/* ======================================================
   CHARACTER
====================================================== */

.character-section{
    position:relative;
    overflow:hidden;
}

.character{

    position:absolute;

    right:-5%;
    bottom:0;

    height:100%;
    width:100%;

    background:
        url("hero.png")
        right bottom / contain no-repeat;

    animation:idleFloat 6s ease-in-out infinite;

    pointer-events:none;
}

/* shadow fade */

.character::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to left,
            transparent,
            rgba(0,0,0,.6)
        );
}

@keyframes idleFloat{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }
}

/* ======================================================
   PARTICLES
====================================================== */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.particle{

    position:absolute;

    width:2px;
    height:2px;

    background:#ff3c3c;

    border-radius:50%;

    opacity:.5;

    animation:rise linear infinite;
}

@keyframes rise{

    from{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:.8;
    }

    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}

/* ======================================================
   RESPONSIVE
====================================================== */

@media(max-width:1100px){

    .container{
        grid-template-columns:20% 50% 30%;
    }

    .panel-title{
        font-size:48px;
    }
}

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .container{
        grid-template-columns:1fr;
    }

    .sidebar{

        position:absolute;

        top:0;
        left:0;

        width:100%;

        height:auto;

        z-index:50;

        flex-direction:row;

        justify-content:space-between;
        align-items:center;

        padding:18px;
    }

    .menu{
        flex-direction:row;
        flex-wrap:wrap;
    }

    .menu-item{
        padding:12px;
        font-size:11px;
    }

    .character-section{

        position:absolute;
        inset:0;

        opacity:.18;

        z-index:-1;
    }

    .login-section{
        padding-top:140px;
    }
}

@media(max-width:650px){

    .logo-main{
        font-size:34px;
    }

    .panel-title{
        font-size:38px;
    }

    .panel-desc{
        font-size:18px;
    }

    .login-panel{
        padding:34px 24px;
    }
}

</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg"></div>
<div class="vignette"></div>
<div class="moon-glow"></div>
<div class="clouds"></div>

<!-- FOG -->
<div class="fog fog1"></div>
<div class="fog fog2"></div>

<!-- PARTICLES -->
<div class="particles" id="particles"></div>

<!-- MAIN -->
<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">

            <div class="logo-main">
                BloodThrone
            </div>

            <div class="logo-sub">
                IMMORTAL KINGDOM
            </div>

        </div>

        <nav class="menu">

            <div class="menu-item">
                <span class="menu-icon">✦</span>
                LOGIN
            </div>

            <div class="menu-item">
                <span class="menu-icon">✦</span>
                REGISTER
            </div>

            <div class="menu-item">
                <span class="menu-icon">✦</span>
                SETTINGS
            </div>

            <div class="menu-item">
                <span class="menu-icon">✦</span>
                CREDITS
            </div>

            <div class="menu-item">
                <span class="menu-icon">✦</span>
                EXIT
            </div>

        </nav>

    </aside>

    <!-- LOGIN -->
    <main class="login-section">

        <div class="login-panel">

            <div class="panel-top">
                ENTER THE ETERNAL NIGHT
            </div>

            <h1 class="panel-title">
                Vampire<br>
                Kingdom
            </h1>

            <div class="panel-desc">
                The blood moon rises once more.<br>
                Return to your throne, immortal one.
            </div>

            <div class="input-group">

                <label>USERNAME</label>

                <input type="text" placeholder="Enter username">

            </div>

            <div class="input-group">

                <label>PASSWORD</label>

                <input type="password" placeholder="Enter password">

            </div>

            <div class="options">

                <div class="checkbox">
                    <input type="checkbox">
                    <span>Remember Me</span>
                </div>

                <a href="#">Forgot Password?</a>

            </div>

            <button class="login-btn">
                ENTER THE REALM
            </button>

        </div>

    </main>

    <!-- CHARACTER -->
    <section class="character-section">

        <div class="character"></div>

    </section>

</div>

<script>

/* ======================================================
   EMBER PARTICLES
====================================================== */

const particles = document.getElementById("particles");

for(let i=0;i<80;i++){

    const p = document.createElement("div");

    p.classList.add("particle");

    const size = Math.random()*4 + 1;

    p.style.width = size + "px";
    p.style.height = size + "px";

    p.style.left = Math.random()*100 + "%";

    p.style.bottom = "-20px";

    p.style.animationDuration =
        (Math.random()*12 + 8) + "s";

    p.style.animationDelay =
        Math.random()*6 + "s";

    particles.appendChild(p);
}

/* ======================================================
   PARALLAX
====================================================== */

document.addEventListener("mousemove",(e)=>{

    const x =
        (window.innerWidth / 2 - e.clientX) / 60;

    const y =
        (window.innerHeight / 2 - e.clientY) / 60;

    document.querySelector(".bg").style.transform =
        `scale(1.03) translate(${x/2}px, ${y/2}px)`;

    document.querySelector(".character").style.transform =
        `translate(${x}px, ${y}px)`;
});

</script>

</body>
</html>
